version: "3.9"

services:
  deepbridge:
    build: .
    image: deepbridge:local
    container_name: deepbridge
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
