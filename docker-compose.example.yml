version: "3.9"

services:
  deepbridge:
    build: .
    image: deepbridge:local
    container_name: deepbridge
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEWSHOSTING_SERVER_HOST: ${NEWSHOSTING_SERVER_HOST:-srv.aboutusenet.com}
      NEWSHOSTING_SERVER_IP: ${NEWSHOSTING_SERVER_IP:-81.171.93.8}
      NEWSHOSTING_SERVER_PORT: ${NEWSHOSTING_SERVER_PORT:-5598}
      NEWSHOSTING_MAX_NZB_FILES: ${NEWSHOSTING_MAX_NZB_FILES:-32}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
